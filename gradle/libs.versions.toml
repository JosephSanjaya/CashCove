[versions]
# Project
min-sdk = "24"
target-sdk = "36"
compile-sdk = "36"

desugar = "2.1.5"
retrofit = "3.0.0"
okhttp = "4.12.0"
store = "5.1.0-alpha07"
room = "2.7.0"
ksp = "2.2.20-2.0.3"
datastore = "1.1.1"
foundation = "1.9.2"
material3 = "1.4.0"

[libraries]
androidx-desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
store = { module = "org.mobilenativefoundation.store:store5", version.ref = "store" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

[bundles]
room = [
    "room-runtime",
    "room-ktx"
]

datastore = [
    "datastore-preferences",
    "datastore"
]

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }